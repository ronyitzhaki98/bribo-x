name: bribo-x-reply
on:
  schedule:
    - cron: "47 */2 * * *"
    # Backup trigger: the mention cursor makes an extra run harmless.
    - cron: "7 1-23/2 * * *"
  workflow_dispatch: {}
concurrency:
  group: bribo-x
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  reply:
    if: vars.BRIBO_X_PAUSED == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bribo-x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bribo-x/package-lock.json
      - run: npm ci
      - run: npm run reply
        env:
          X_API_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_API_SECRET: ${{ secrets.X_SECRET_KEY }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRIBO_X_LLM: ${{ vars.BRIBO_X_LLM }}
          BRIBO_X_PAUSED: ${{ vars.BRIBO_X_PAUSED }}
          BRIBO_X_DRY_RUN: ${{ vars.BRIBO_X_DRY_RUN }}
      - name: Commit state
        if: ${{ !cancelled() && vars.BRIBO_X_PAUSED == 'false' && vars.BRIBO_X_DRY_RUN != 'true' }}
        run: bash scripts/commit-state.sh
