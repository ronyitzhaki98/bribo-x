name: bribo-x-bank
on:
  workflow_dispatch:
    inputs:
      total:
        description: "How many candidates to generate"
        default: "1000"
permissions:
  contents: read
jobs:
  bank:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bribo-x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bribo-x/package-lock.json
      - run: npm ci
      - run: npm run bank
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRIBO_X_LLM: ${{ vars.BRIBO_X_LLM }}
          BANK_TOTAL: ${{ inputs.total }}
      - uses: actions/upload-artifact@v4
        with:
          name: bank-candidates
          path: bribo-x/out/bank-candidates.json
