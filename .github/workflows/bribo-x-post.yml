name: bribo-x-post
on:
  schedule:
    - cron: "17 0,2,4,10,12,14,16,18,20,22 * * *"
    # Backup trigger: GitHub often skips or delays scheduled runs; the slot guard prevents double posts.
    - cron: "47 0,2,4,10,12,14,16,18,20,22 * * *"
  workflow_dispatch:
    inputs:
      force_slot:
        description: "Ignore the daily plan (always a dry run while paused)"
        type: boolean
        default: true
concurrency:
  group: bribo-x
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  post:
    if: vars.BRIBO_X_PAUSED == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bribo-x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bribo-x/package-lock.json
      - run: npm ci
      - run: npm run post
        env:
          X_API_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_API_SECRET: ${{ secrets.X_SECRET_KEY }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRIBO_X_LLM: ${{ vars.BRIBO_X_LLM }}
          BRIBO_X_PAUSED: ${{ vars.BRIBO_X_PAUSED }}
          BRIBO_X_DRY_RUN: ${{ vars.BRIBO_X_DRY_RUN }}
          FORCE_SLOT: ${{ inputs.force_slot }}
      - name: Commit state
        if: ${{ !cancelled() && vars.BRIBO_X_PAUSED == 'false' && vars.BRIBO_X_DRY_RUN != 'true' }}
        run: bash scripts/commit-state.sh
